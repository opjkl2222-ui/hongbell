<body class="text-gray-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const exam2Data = [
            { id: 1, question: "지문항법에 대한 설명으로 맞는 것은?", options: ["비행한 과거의 속도와 방위만으로 미래의 위치를 예상하는 항법이다.", "항법 중 가장 어려운 방법으로 무선항법이 불가능한 장거리 해상비행에서 사용하는 항법이다.", "항공도를 이용하여 지상에 있는 참조물을 육안으로 확인하며 비행하는 항법이다.", "지상목표 없이 기본계기를 이용해 예상되는 경로를 비행하는 항법이다."], answer: 2, explanation: "지문항법(pilotage)은 육상 또는 해안에서 시계비행상태 하에서 가능한 항법으로 육안으로 확인되는 지상의 구조물이나 지형 또는 항공도를 보고 비행하는 방법이다." },
            { id: 2, question: "대권(great circle)에 대한 설명 중 틀린 것은?", options: ["구에서 그려질 수 있는 가장 큰 원이다.", "지구 중심으로부터 곡선으로 그려진다.", "구의 두 지점 간의 최단거리이다.", "대권의 개수는 유한하다."], answer: 3, explanation: "대권(great circle)은 지구상에서 가장 큰 원으로 대권의 호(arc)는 지표면에서 두 지점 간의 최단거리이다. 대권의 개수는 무한하며, 대권의 대표적인 예는 자오선과 적도이다." },
            { id: 3, question: "지구 표면을 이동하는 항공기의 속도는?", options: ["지시속도", "대지속도", "진대기속도", "상대속도"], answer: 1, explanation: "속도의 유형은 다음과 같다.\n1. 대기속도(air speed) : 대기 속을 이동하는 항공기의 속도, 즉 대기에 대한 항공기의 속도\n2. 대지속도(ground speed) : 지표면에 대한 항공기의 속도\n3. 상대속도(relative speed) : 다른 항공기에 대한 항공기의 속도" },
            { id: 4, question: "항정선 항로에 대한 설명으로 틀린 것은?", options: ["최단거리 항로이다.", "장거리 비행일수록 비경제적이다.", "적도와 자오선은 항정선이면서 대권이다.", "자오선과 동일한 각도로 교차하는 곡선이다."], answer: 0, explanation: "항정선 항로(rhumb line course)는 지구의 두 지점을 연결한 선이 각 자오선과 동일한 각도로 교차하는 항로로 최단거리는 아니지만 항법이 용이하다. 그러나 장거리를 비행할 경우 비행거리가 멀어져 비경제적이다.\n[참고] 최단거리 항로는 대권항로이다." },
            { id: 5, question: "1시간당 지구의 자전속도(rotation rate)는?", options: ["30°", "25°", "15°", "10°"], answer: 2, explanation: "지구는 남북 양극을 축으로 1일(24시간) 1회전(360°)하므로 1시간당 지구의 자전속도는 15°이다." },
            { id: 6, question: "Relative bearing에 대한 설명으로 옳은 것은?", options: ["자북에서부터 시계방향으로 측정한다.", "자북에서부터 반시계방향으로 측정한다.", "항공기 기수에서부터 시계방향으로 측정한다.", "항공기 기수에서부터 반시계방향으로 측정한다."], answer: 2, explanation: "상대방위(relative bearing)란 항공기 기수를 기준으로 송신소(station)까지 시계방향으로 측정한 각도를 말한다." },
            { id: 7, question: "Lambert 도법에 대한 설명 중 옳은 것은?", options: ["항정선은 직선이다.", "거리측정이 부정확하다.", "자오선은 직선이다.", "대권은 곡선이다."], answer: 2, explanation: "원추투영법인 Lambert conformal chart의 특성은 다음과 같다.\n1. 자오선(meridian)이 극으로 집중하고 위선과 직교하며 간격이 일정하다.\n2. 위선(parallel)이 극을 중심으로 한 곡선이며 간격이 일정하다.\n3. 왜곡이 적고 위도의 폭이 일정하며, 실제 모양과 거의 유사하다.\n4. 적도는 표준 위선(standard parallel) 내에서 아주 정확하다.\n5. 대권(great circle)이 직선이다.\n6. 항정선(rhumb line)이 곡선이다." },
            { id: 8, question: "Magnetic heading 270°로 비행하는 항공기가 radial 360°에 11시 44분에 도착하였다. Radial 360°를 지나 radial 350°를 11시 47분에 통과하였다면 이곳으로부터 station까지의 비행시간은 얼마인가?", options: ["18분", "22분", "29분", "35분"], answer: 0, explanation: "Station까지의 시간 = [방위 변화 소요시간(분) × 60] / 방위 변화량(°)\n= (3 × 60) / 10 = 18분" },
            { id: 9, question: "선회반경이 2 NM인 항공기가 station으로부터 20 NM 떨어진 위치에서 90° 진입각도로 intercept하기 위한 lead point는?", options: ["2°", "3°", "4°", "6°"], answer: 3, explanation: "Lead point = TR × (60 / arc distance)\n(진입각이 90°이므로, 1 TR 적용)\n= 2 × (60 / 20) = 6°" },
            { id: 10, question: "자차(deviation)에 대한 설명 중 틀린 것은?", options: ["자북과 나북 간의 각도를 자차라고 한다.", "기체의 자성체로 인하여 발생하는 오차이다.", "항공기 기수방향에 크게 영향을 받는다.", "경위도에 영향을 받지 않는다."], answer: 3, explanation: "자차(deviation)는 항공기 기수방향이 바뀌었을 때 가장 영향이 크다. 또한 지구상의 위치가 변화할 때, 특히 위도가 많이 변했을 때는 자차가 변하므로 자차수정을 하여야 한다." },
            { id: 11, question: "항공기의 기수를 급격하게 들었을 때 발생할 수 있는 고도계의 오차는?", options: ["위치 오차", "탄성 오차", "눈금 오차", "반전 오차"], answer: 1, explanation: "순간적으로 항공기의 기수를 급격하게 들거나 내리면 재료의 특성 때문에 탄성체 고유의 오차가 발생할 수 있으며, 이를 탄성 오차(hysteresis error)라고 한다." },
            { id: 12, question: "다음 중 가장 낮은 주파수대를 사용하는 항법 시설은?", options: ["NDB", "TACAN", "DME", "VOR"], answer: 0, explanation: "무지향표지시설(NDB)은 일반적으로 190~535 kHz의 주파수대에서 운용되어 주파수가 가장 낮다. (VOR: 111.975~117.975 MHz, DME: 960~1,215 MHz)" },
            { id: 13, question: "동일한 주파수를 사용하는 VOR은 최소 몇 마일의 간격을 두고 설치하여야 하는가?", options: ["600 NM", "900 NM", "1,000 NM", "1,500 NM"], answer: 0, explanation: "부호명칭은 항행안전무선시설로부터 1,100 km(600 NM) 이내에서 중복 사용되어서는 안된다." },
            { id: 14, question: "Outer Marker 통과 시 수신할 수 있는 등화의 색상은?", options: ["Blue", "Amber", "White", "Red"], answer: 0, explanation: "마커 비콘 등화 색상:\n- Outer marker: 청색(Blue)\n- Middle Marker: 황색(Amber)\n- Inner Marker: 백색(White)" },
            { id: 15, question: "Above glide path 시 tri-color VASI의 지시 색깔은?", options: ["Red", "Amber", "Green", "White"], answer: 1, explanation: "3색 시각진입각지시등(tri-color VASI) 등화 색상:\n1. 낮은 활공로: 적색(Red)\n2. 적정한 활공로: 녹색(Green)\n3. 높은 활공로: 황색(Amber)" },
            { id: 16, question: "게이트 접현시 marshaller가 팔을 수평으로 들어 가슴부분에서 주먹을 펴는 것은 무엇을 의미하는가?", options: ["브레이크를 풀어라.", "게이트에 접현되었다.", "엔진을 꺼라.", "Rotating beacon을 꺼라."], answer: 0, explanation: "조종사에 대한 유도원(marshaller) 신호:\n- 브레이크를 걸어라: 어깨 높이에서 주먹을 쥔다.\n- 브레이크를 풀어라: 주먹을 쥐고 어깨 높이로 올렸다가 손을 핀다." },
            { id: 17, question: "전이고도 미만에서의 고도계 setting 방식은?", options: ["QNE", "QNH", "QFE", "QFF"], answer: 1, explanation: "전이고도 미만에서는 185 km 이내에 있는 관제기관으로부터 통보받은 QNH로 고도계를 수정하여야 한다." },
            { id: 18, question: "지표면이 표준기압일 때, 대기압이 해면기압의 1/2로 감소되는 고도는?", options: ["8,000피트", "10,000피트", "15,000피트", "18,000피트"], answer: 3, explanation: "고도가 높아질수록 대기압은 감소하며 18,000 ft에서의 대기압은 해면 대기압의 1/2이 된다." },
            { id: 19, question: "Side-step maneuver는 언제 시작하여야 하는가?", options: ["활주로 또는 활주로의 주변시설을 발견한 후 가능한 빨리", "Minimum descent altitude/Decision height에 도달한 후", "Missed approach point에 도달한 후", "Final approach fix를 지난 후"], answer: 0, explanation: "조종사는 활주로 또는 활주로 환경을 육안으로 확인한 후 가능한 빨리 측면이동접근(side-step maneuver)을 시작하여야 한다." },
            { id: 20, question: "공항 표고(airport elevation)의 기준이 되는 것은?", options: ["활주로중심선 중 가장 높은 지점의 표고를 기준으로 한다.", "착륙지역 중 가장 높은 지점의 표고를 기준으로 한다.", "공항 지표면의 평균 높이를 기준으로 한다.", "공항 표점(reference point)의 표고를 기준으로 한다."], answer: 1, explanation: "공항표고(Airport elevation)라 함은 착륙구역에서 가장 높은 지점의 표고를 말한다." },
            { id: 21, question: "지연이 예상될 때 항공기가 허가한계점에 도착하기 최소한 몇 분 전까지 체공지시를 발부하여야 하는가?", options: ["3분", "5분", "7분", "10분"], answer: 1, explanation: "지연이 예상될 때 적어도 5분 전에 허가한계점과 체공지시를 발부하여야 한다." },
            { id: 22, question: "최저레이더유도고도(MVA)에 대한 설명으로 틀린 것은?", options: ["각 섹터는 장애물로부터 최소 3 NM 이상 떨어져 있다.", "섹터 내에서 장애물로부터 산악지역에서는 2,000 ft, 비산악지역에서는 1,000 ft의 고도분리를 제공한다.", "관제공역의 하단에서부터 적어도 300 ft 이상의 간격을 제공한다.", "MEA, MOCA 또는 다른 최저안전고도보다 높아야 한다."], answer: 3, explanation: "일부 MVA는 비레이더 최저항로고도(MEA), 최저장애물회피고도(MOCA) 또는 차트에 표기된 다른 최저고도보다 낮을 수도 있다." },
            { id: 23, question: "동일 활주로 상에서 출항하는 CAT Ⅱ 항공기와 뒤따라 이륙하는 CAT Ⅰ 항공기 간의 분리간격은?", options: ["2,000피트", "3,000피트", "4,500피트", "6,000피트"], answer: 1, explanation: "선행 CAT II 항공기가 이륙 후 CAT I 항공기가 뒤따를 때 분리 간격은 3,000 ft 이다." },
            { id: 24, question: "운항승무원에게 요구되는 능력과 인적특성이 아닌 것은?", options: ["평균보다 높은 수준의 지능", "우수한 감각", "풍부한 감성", "건전한 정신과 인성"], answer: 2, explanation: "요구 능력: 평균 이상의 지능, 우수한 감각/신경근육 협동작용, 건전한 정신/정서안정. ('풍부한 감성'은 필수 조건이 아님)" },
            { id: 25, question: "인적요소 분야에서 승무원 상호 간 교차 모니터링 협력의 필요성이 늘어남에 따라 중요하게 여겨지는 관계는?", options: ["Liveware - Hardware 관계", "Liveware - Software 관계", "Liveware - Environment 관계", "Liveware - Liveware 관계"], answer: 3, explanation: "승무원 상호 간 교차 모니터링(cross monitoring) 협력이 점증함에 따라 인간-인간(Liveware-Liveware) 관계를 가장 중요시하고 있다." }
        ];

        const exam3Data = [
            { id: 1, question: "적도에 관한 설명 중 틀린 것은?", options: ["적도는 지구의 자전축에 수직한 대권이다.", "적도는 남극과 북극 양극으로부터 같은 거리에 있다.", "적도는 지구의 위도를 정하는 기준이 된다.", "적도는 항정선이라고 할 수 없다."], answer: 3, explanation: "1. 적도는 지구의 중심을 통과하고 지축에 수직인 평면이 지표면과 접하는 원이며, 남극과 북극 양극으로부터 같은 거리에 있는 대권이다. 모든 위도 표시의 기준이 된다.\n2. 적도는 각 자오선과 항상 동일한 각을 이루기 때문에 항정선이 된다. 적도와 자오선은 항정선이면서 대권이다." },
            { id: 2, question: "경도 1°의 길이가 0 NM이 되는 곳은?", options: ["북위 0°와 남위 0°가 되는 지점", "북위 45°와 남위 45°가 되는 지점", "북위 60°와 남위 60°가 되는 지점", "북위 90°와 남위 90°가 되는 지점"], answer: 3, explanation: "경도 1° 간의 거리는 고위도로 갈수록 짧아지고, 북위 90°와 남위 90°가 되는 지점인 양극에서 0이 된다." },
            { id: 3, question: "152°W에서 지방시가 5일 20시일 때 UTC는?", options: ["5일 오전 10시", "5일 오후 2시", "6일 오전 2시", "6일 오전 6시"], answer: 3, explanation: "• 먼저 152°W를 해당하는 시간으로 환산한다. 152° ÷ 15 = +10(남머지 2°) (∵ 서경: +)\n• 지방시(LMT)에 적용하여 UTC를 구한다.\n LMT: 5일 20:00 + 10:00 = 6일 06:00 (6일 오전 6시)" },
            { id: 4, question: "우리나라에서 위도 1분의 길이가 1 NM이 되는 곳은?", options: ["북위 15°", "북위 45°", "북위 70°", "북위 80°"], answer: 1, explanation: "해당 지역에서 위도 1′의 길이를 1 NM으로 하여 해상마일의 단위로 한다. 우리나라 부근에서 실제 위도 1′의 길이가 1 NM에 해당되는 곳은 북위 45° 부근이다." },
            { id: 5, question: "육도, 해도, 항공도의 분류 기준은 무엇인가?", options: ["제작방식에 따른 분류", "사용목적에 따른 분류", "축척에 따른 분류", "크고 작음에 따른 분류"], answer: 1, explanation: "지도는 그의 사용목적에 따라 육도, 해도와 항공도 등으로 분류할 수 있다." },

                                            buttonStyle += "border-red-500 bg-red-50 text-red-900 font-bold";
                                        } else {
                                            buttonStyle += "border-gray-200 bg-gray-50 text-gray-400 opacity-60";
                                        }
                                    }

                                    const circleNumbers = ['①', '②', '③', '④'];

                                    return (
                                        <button 
                                            key={index}
                                            onClick={() => handleOptionSelect(index)}
                                            disabled={isAnswerSubmitted}
                                            className={`${buttonStyle} flex items-start`}
                                        >
                                            <span className="inline-block w-8 shrink-0 font-bold opacity-80 mt-0.5 text-center mr-2 text-lg">
                                                {circleNumbers[index]}
                                            </span>
                                            <span className="text-left break-keep leading-relaxed text-base md:text-lg">
                                                {option}
                                            </span>
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Explanation Block */}
                            {isAnswerSubmitted && (
                                <div className="mt-8 fade-in">
                                    {selectedAnswer !== question.answer ? (
                                        <div className="bg-red-50 border-l-4 border-red-500 p-5 rounded-r-xl mb-6">
                                            <div className="flex items-center mb-2">
                                                <svg className="w-6 h-6 text-red-500 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                                </svg>
                                                <h3 className="text-xl font-bold text-red-700">오답입니다</h3>
                                            </div>
                                            <div className="text-gray-900 leading-relaxed whitespace-pre-line text-lg md:text-xl font-medium mt-3 pt-4 border-t border-red-200">
                                                <span className="font-bold text-red-800 block mb-2 text-base">상세 해설:</span>
                                                {question.explanation}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="bg-green-50 border-l-4 border-green-500 p-5 rounded-r-xl mb-6">
                                            <div className="flex items-center mb-2">
                                                <svg className="w-6 h-6 text-green-500 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path>
                                                </svg>
                                                <h3 className="text-xl font-bold text-green-700">정답입니다!</h3>
                                            </div>
                                            <div className="text-gray-900 leading-relaxed whitespace-pre-line text-lg md:text-xl font-medium mt-3 pt-4 border-t border-green-200">
                                                <span className="font-bold text-green-800 block mb-2 text-base">상세 해설:</span>
                                                {question.explanation}
                                            </div>
                                        </div>
                                    )}
                                    
                                    <div className="flex justify-end">
                                        <button 
                                            onClick={handleNext}
                                            className="bg-gray-800 hover:bg-gray-900 text-white font-bold py-3.5 px-8 rounded-xl transition duration-200 shadow-lg flex items-center text-lg active:scale-95"
                                        >
                                            {currentQuestion === quizData.length - 1 ? '결과 보기' : '다음 문제'}
                                            <svg className="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
