<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공중항법 모의고사 어플</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #f3f4f6; 
        }
        .option-btn { 
            transition: all 0.2s ease-in-out; 
        }
        .option-btn:hover:not(:disabled) { 
            background-color: #e0e7ff; 
            border-color: #6366f1; 
        }
        .option-correct { 
            background-color: #d1fae5 !important; 
            border-color: #10b981 !important; 
            color: #065f46 !important; 
            font-weight: 600;
        }
        .option-incorrect { 
            background-color: #fee2e2 !important; 
            border-color: #ef4444 !important; 
            color: #991b1b !important; 
        }
        .option-disabled { 
            opacity: 0.8; 
            cursor: not-allowed; 
        }
        /* 스크롤바 숨기기 (모바일 최적화) */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="text-gray-800 antialiased">
    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden flex flex-col relative">
        
        <!-- 홈 화면 -->
        <div id="home-screen" class="p-6 flex flex-col h-full min-h-screen">
            <div class="text-center mt-8 mb-8">
                <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">자가용 조종사 학과시험</span>
                <h1 class="text-3xl font-extrabold text-gray-900 mt-3">공중항법 모의고사</h1>
                <p class="text-sm text-gray-500 mt-2">원하는 회차(2회~14회)를 선택하여 학습을 시작하세요.</p>
            </div>
            
            <div class="grid grid-cols-2 gap-4 pb-8" id="exam-list">
                <!-- 자바스크립트를 통해 버튼 자동 생성 -->
            </div>
        </div>

        <!-- 퀴즈 화면 -->
        <div id="quiz-screen" class="hidden flex-col h-full min-h-screen bg-gray-50">
            <!-- 헤더 영역 -->
            <div class="bg-white p-4 flex items-center justify-between shadow-sm z-10">
                <button id="btn-back" class="text-gray-500 hover:text-gray-800 focus:outline-none p-2 rounded-full hover:bg-gray-100 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 id="quiz-title" class="text-lg font-bold text-gray-800">모의고사</h2>
                <div class="w-10"></div> <!-- 중앙 정렬을 위한 여백 -->
            </div>
            
            <!-- 진행률 표시 바 -->
            <div class="bg-gray-200 h-1.5 w-full">
                <div id="progress-bar" class="bg-blue-600 h-1.5 w-0 transition-all duration-300 ease-out"></div>
            </div>

            <!-- 문제 및 보기 내용 영역 -->
            <div class="p-6 flex-1 overflow-y-auto">
                <div class="flex justify-between items-end mb-4">
                    <div class="text-sm font-bold text-blue-600 bg-blue-100 px-3 py-1 rounded-md">Question <span id="current-q-num">1</span> <span class="text-blue-400 font-normal">/ 25</span></div>
                </div>
                
                <h3 id="question-text" class="text-[1.1rem] font-bold text-gray-800 mb-6 leading-relaxed break-keep"></h3>
                
                <div id="options-container" class="space-y-3 mb-8">
                    <!-- 자바스크립트를 통해 보기 버튼 자동 생성 -->
                </div>

                <!-- 해설 박스 -->
                <div id="explanation-box" class="hidden bg-white p-5 rounded-xl shadow-sm border border-gray-200 mb-6 animate-fade-in-up">
                    <div class="flex items-center mb-3">
                        <svg class="w-5 h-5 text-green-500 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                        <h4 class="font-bold text-gray-800">정답 및 해설 (교재 원문)</h4>
                    </div>
                    <p id="explanation-text" class="text-[0.82rem] text-gray-600 whitespace-pre-wrap leading-relaxed break-keep"></p>
                </div>
            </div>

            <!-- 하단 버튼 영역 -->
            <div class="p-4 bg-white border-t border-gray-100 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                <button id="btn-next" class="w-full bg-blue-600 text-white font-bold text-lg py-3.5 rounded-xl shadow-md hover:bg-blue-700 transition hidden">다음 문제</button>
            </div>
        </div>
        
        <!-- 결과 화면 -->
        <div id="result-screen" class="hidden p-8 flex flex-col items-center justify-center h-full min-h-screen bg-gray-50 text-center">
            <div class="w-24 h-24 bg-blue-100 rounded-full flex items-center justify-center mb-6">
                <svg class="w-12 h-12 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path></svg>
            </div>
            <h2 class="text-3xl font-extrabold mb-2 text-gray-800">모의고사 완료!</h2>
            <p class="text-gray-500 mb-8">수고하셨습니다. 학습 결과를 확인하세요.</p>
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 w-full mb-8">
                <div class="text-sm text-gray-500 mb-1">최종 점수</div>
                <div class="text-5xl font-black text-blue-600"><span id="score-text"></span><span class="text-2xl text-gray-400 font-bold"> / 25</span></div>
            </div>
            
            <button id="btn-home" class="w-full bg-gray-900 text-white font-bold text-lg py-4 rounded-xl shadow-md hover:bg-gray-800 transition">홈으로 돌아가기</button>
        </div>
    </div>

    <script>
        const quizData = {
            "2": [
                {
                    q: "1. 지문항법에 대한 설명으로 맞는 것은?",
                    options: [
                        "① 비행한 과거의 속도와 방위만으로 미래의 위치를 예상하는 항법이다.",
                        "② 항법 중 가장 어려운 방법으로 무선항법이 불가능한 장거리 해상비행에서 사용하는 항법이다.",
                        "③ 항공도를 이용하여 지상에 있는 참조물을 육안으로 확인하며 비행하는 항법이다.",
                        "④ 지상목표 없이 기본계기를 이용해 예상되는 경로를 비행하는 항법이다."
                    ],
                    ans: 3,
                    expl: "지문항법(pilotage)은 육상 또는 해안에서 시계비행상태 하에서 가능한 항법으로 육안으로 확인되는 지상의 구조물이나 지형 또는 항공도를 보고 비행하는 방법이다."
                },
                {
                    q: "2. 대권(great circle)에 대한 설명 중 틀린 것은?",
                    options: [
                        "① 구에서 그려질 수 있는 가장 큰 원이다.",
                        "② 지구 중심으로부터 곡선으로 그려진다.",
                        "③ 구의 두 지점 간의 최단거리이다.",
                        "④ 대권의 개수는 유한하다."
                    ],
                    ans: 4,
                    expl: "대권(great circle)은 지구상에서 가장 큰 원으로 대권의 호(arc)는 지표면에서 두 지점 간의 최단거리이다. 대권의 개수는 무한하며, 대권의 대표적인 예는 자오선과 적도이다."
                },
                {
                    q: "3. 지구 표면을 이동하는 항공기의 속도는?",
                    options: ["① 지시속도", "② 대지속도", "③ 진대기속도", "④ 상대속도"],
                    ans: 2,
                    expl: "속도의 유형은 다음과 같다.\n1. 대기속도(air speed) : 대기 속을 이동하는 항공기의 속도, 즉 대기에 대한 항공기의 속도\n2. 대지속도(ground speed): 지표면에 대한 항공기의 속도\n3. 상대속도(relative speed): 다른 항공기에 대한 항공기의 속도"
                },
                {
                    q: "4. 항정선 항로에 대한 설명으로 틀린 것은?",
                    options: [
                        "① 최단거리 항로이다.",
                        "② 장거리 비행일수록 비경제적이다.",
                        "③ 적도와 자오선은 항정선이면서 대권이다.",
                        "④ 자오선과 동일한 각도로 교차하는 곡선이다."
                    ],
                    ans: 1,
                    expl: "항정선 항로(rhumb line course)는 지구의 두 지점을 연결한 선이 각 자오선과 동일한 각도로 교차하는 항로로 최단거리는 아니지만 항법이 용이하다. 그러나 장거리를 비행할 경우 비행거리가 멀어져 비경제적이다.\n[참고] 최단거리 항로는 대권항로이다."
                },
                {
                    q: "5. 1시간당 지구의 자전속도(rotation rate)는?",
                    options: ["① 30°", "② 25°", "③ 15°", "④ 10°"],
                    ans: 3,
                    expl: "지구는 남북 양극을 축으로 1일(24시간) 1회전(360°)하므로 1시간당 지구의 자전속도는 15°이다."
                },
                {
                    q: "6. Relative bearing에 대한 설명으로 옳은 것은?",
                    options: [
                        "① 자북에서부터 시계방향으로 측정한다.",
                        "② 자북에서부터 반시계방향으로 측정한다.",
                        "③ 항공기 기수에서부터 시계방향으로 측정한다.",
                        "④ 항공기 기수에서부터 반시계방향으로 측정한다."
                    ],
                    ans: 3,
                    expl: "상대방위(relative bearing)란 항공기 기수를 기준으로 송신소(station)까지 시계방향으로 측정한 각도를 말한다."
                },
                {
                    q: "7. Lambert 도법에 대한 설명 중 옳은 것은?",
                    options: [
                        "① 항정선은 직선이다.",
                        "② 거리측정이 부정확하다.",
                        "③ 자오선은 직선이다.",
                        "④ 대권은 곡선이다."
                    ],
                    ans: 3,
                    expl: "원추투영법인 Lambert conformal chart의 특성은 다음과 같다.\n1. 자오선(meridian)이 극으로 집중하고 위선과 직교하며 간격이 일정하다.\n2. 위선(parallel)이 극을 중심으로 한 곡선이며, 간격이 일정하다.\n3. 왜곡이 적고 위도의 폭이 일정하며, 실제 모양과 거의 유사하다.\n4. 척도는 표준 위선(standard parallel) 내에서 아주 정확하다.\n5. 대권(great circle)이 직선이다.\n6. 항정선(rhumb line)이 곡선이다."
                },
                {
                    q: "8. Magnetic heading 270°로 비행하는 항공기가 radial 360°에 11시 44분에 도착하였다. Radial 360°를 지나 radial 350°를 11시 47분에 통과하였다면 이곳으로부터 station까지의 비행시간은 얼마인가?",
                    options: ["① 18분", "② 22분", "③ 29분", "④ 35분"],
                    ans: 1,
                    expl: "Station까지의 시간 = 방위 변화 소요시간(분) × 60 / 방위 변화량(°)\n= 3 × 60 / 10 = 18분"
                },
                {
                    q: "9. 선회반경이 2 NM인 항공기가 station으로부터 20 NM 떨어진 위치에서 90° 진입각도로 intercept하기 위한 lead point는?",
                    options: ["① 2°", "② 3°", "③ 4°", "④ 6°"],
                    ans: 4,
                    expl: "Lead point = (60 / arc distance) × TR\n= (60 / 20) × 2 = 6°\n(진입각이 90°이므로, 1TR 적용)"
                },
                {
                    q: "10. 자차(deviation)에 대한 설명 중 틀린 것은?",
                    options: [
                        "① 자북과 나북 간의 각도를 자차라고 한다.",
                        "② 기체의 자성체로 인하여 발생하는 오차이다.",
                        "③ 항공기 기수방향에 크게 영향을 받는다.",
                        "④ 경위도에 영향을 받지 않는다."
                    ],
                    ans: 4,
                    expl: "자차(deviation)는 항공기 기수방향이 바뀌었을 때 가장 영향이 크다. 또한 지구상의 위치가 변화할 때, 특히 위도가 많이 변했을 때는 자차가 변하므로 자차수정을 하여야 한다."
                },
                {
                    q: "11. 항공기의 기수를 급격하게 들었을 때 발생할 수 있는 고도계의 오차는?",
                    options: ["① 위치 오차", "② 탄성 오차", "③ 눈금 오차", "④ 반전 오차"],
                    ans: 2,
                    expl: "고도계 오차의 종류에는 기계적 오차, 눈금 오차, 장착 오차, 반전 오차, 탄성 오차, 온도 오차와 기압 오차가 있다.\n순간적으로 항공기의 기수를 급격하게 들거나 내리면 재료의 특성 때문에 탄성체 고유의 오차가 발생할 수 있으며, 이를 탄성 오차(hysteresis error)라고 한다."
                },
                {
                    q: "12. 다음 중 가장 낮은 주파수대를 사용하는 항법 시설은?",
                    options: ["① NDB", "② TACAN", "③ DME", "④ VOR"],
                    ans: 1,
                    expl: "무지향표지시설(NDB)은 ICAO Annex 10에서 규정하고 있는 주파수 범위 190~1,750 kHz를 기준으로 하여, 일반적으로 190~535 kHz의 주파수대에서 운용된다.\nICAO Annex 10에서 규정하고 있는 주파수 범위는 VOR은 111.975~117.975 MHz이고, DME는 960~1,215 MHz이다."
                },
                {
                    q: "13. 동일한 주파수를 사용하는 VOR은 최소 몇 마일의 간격을 두고 설치하여야 하는가?",
                    options: ["① 600 NM", "② 900 NM", "③ 1,000 NM", "④ 1,500 NM"],
                    ans: 1,
                    expl: "2개의 항행안전무선시설이 동일 위치에서 서로 다른 주파수대로 운용될 경우를 제외하고 부호명칭은 항행안전무선시설로부터 1,100 km(600 NM) 이내에서 중복 사용되어서는 안된다."
                },
                {
                    q: "14. Outer Marker 통과 시 수신할 수 있는 등화의 색상은?",
                    options: ["① Blue", "② White", "③ Amber", "④ Red"],
                    ans: 1,
                    expl: "항공기가 마커 비콘(marker beacon) 상공을 통과할 때 이를 지시하는 부호 및 등화는 다음과 같다.\nOuter marker: 청색(Blue)\nMiddle Marker: 황색(Amber)\nInner Marker: 백색(White)"
                },
                {
                    q: "15. Above glide path 시 tri-color VASI의 지시 색깔은?",
                    options: ["① Red", "② Amber", "③ Green", "④ White"],
                    ans: 2,
                    expl: "3색 시각진입각지시등(tri-color VASI)의 등화 색상은 다음과 같다.\n1. 낮은 활공로(below glide path): 적색(red)\n2. 적정한 활공로(on glide path): 녹색(green)\n3. 높은 활공로(above glide path): 황색(amber)"
                },
                {
                    q: "16. 게이트 접현시 marshaller가 팔을 수평으로 들어 가슴부분에서 주먹을 펴는 것은 무엇을 의미하는가?",
                    options: [
                        "① 브레이크를 풀어라.",
                        "② 게이트에 접현되었다.",
                        "③ 엔진을 꺼라.",
                        "④ Rotating beacon을 꺼라."
                    ],
                    ans: 1,
                    expl: "조종사에 대한 유도원(marshaller)의 브레이크 관련 신호는 다음과 같다.\n1. 브레이크를 걸어라 : 손바닥을 편 상태로 어깨 높이로 들어 올린다. 운항승무원을 응시한 채 주먹을 쥔다.\n2. 브레이크를 풀어라: 주먹을 쥐고 어깨 높이로 올린다. 운항승무원을 응시한 채 손을 편다."
                },
                {
                    q: "17. 전이고도 미만에서의 고도계 setting 방식은?",
                    options: ["① QNE", "② QNH", "③ QFE", "④ QFF"],
                    ans: 2,
                    expl: "전이고도 미만에서는 비행로를 따라 185 km 이내에 있는 항공교통관제기관으로부터 통보받은 QNH로 고도계를 수정하여야 한다."
                },
                {
                    q: "18. 지표면이 표준기압일 때, 대기압이 해면기압의 1/2로 감소되는 고도는?",
                    options: ["① 8,000피트", "② 10,000피트", "③ 15,000피트", "④ 18,000피트"],

                {

                    ans: 3,
                    expl: "리더십(leadership)의 유형\n1. 1.1형(방임형): 직무나 인간관계 어느 쪽에 대하여도 별로 관심을 갖지 않는다.\n2. 1.9형(인간관계 지향형): 원만한 인간관계를 최우선으로 한다.\n3. 5.5형(절충형): 자기의 주위와 환경은 다른 승무원들이 받아들일 수 있는 타당한 선에서 맞추려고 노력한다.\n4. 9.1형(직무 지향형): 직무에는 최대한의 노력을 경주하지만 다른 승무원의 의견이나 태도 감정 등에는 거의 관심을 갖지 않는다.\n5. 9.9형(이상형): 가장 이상적인 유형으로 전 승무원의 관련과 참여와 헌신에 바탕을 두어 최고의 성과를 성취하겠다는 것이다."

            ]

        let currentExam = null;
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let userAnswers = [];

        // 홈 화면 모의고사 리스트 렌더링
        function renderHome() {
            const listEl = document.getElementById('exam-list');
            listEl.innerHTML = '';
            
            for (let i = 2; i <= 14; i++) {
                const key = i.toString();
                const btn = document.createElement('button');
                btn.className = "flex flex-col items-center justify-center p-5 bg-white border-2 border-blue-100 rounded-2xl shadow-sm hover:border-blue-500 hover:bg-blue-50 transition-all group";
                btn.innerHTML = `
                    <span class="text-xs font-semibold text-blue-500 mb-1 group-hover:text-blue-600">Mock Exam</span>
                    <span class="text-xl font-black text-gray-800 group-hover:text-blue-700">${i}회 모의고사</span>
                    <span class="text-[11px] text-gray-400 mt-1">총 25문항</span>
                `;
                btn.onclick = () => startExam(key, i);
                listEl.appendChild(btn);
            }
        }

        // 시험 시작
        function startExam(key, num) {
            currentExam = key;
            currentQuestions = quizData[key];
            currentIndex = 0;
            score = 0;
            userAnswers = new Array(currentQuestions.length).fill(null);

            document.getElementById('quiz-title').innerText = `${num}회 모의고사`;
            
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('flex');

            loadQuestion();
        }

        // 문제 로드
        function loadQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('current-q-num').innerText = currentIndex + 1;
            document.getElementById('question-text').innerText = q.q;
            
            // 프로그레스 바 업데이트
            const progress = ((currentIndex + 1) / currentQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // 보기 렌더링
            const optionsEl = document.getElementById('options-container');
            optionsEl.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const optNum = idx + 1;
                const optBtn = document.createElement('button');
                optBtn.className = "option-btn w-full text-left p-4 rounded-xl border border-gray-200 bg-white font-medium text-gray-700 shadow-sm flex items-center justify-between";
                optBtn.innerHTML = `<span>${opt}</span>`;
                
                // 이미 답변을 선택했던 문제라면 상태 복원
                if (userAnswers[currentIndex] !== null) {
                    optBtn.disabled = true;
                    optBtn.classList.add('option-disabled');
                    if (optNum === q.ans) {
                        optBtn.classList.add('option-correct');
                    } else if (optNum === userAnswers[currentIndex]) {
                        optBtn.classList.add('option-incorrect');
                    }
                } else {
                    optBtn.onclick = () => selectAnswer(optNum);
                }
                
                optionsEl.appendChild(optBtn);
            });

            // 해설 박스 및 다음 버튼 처리
            const expBox = document.getElementById('explanation-box');
            const nextBtn = document.getElementById('btn-next');

            if (userAnswers[currentIndex] !== null) {
                expBox.classList.remove('hidden');
                document.getElementById('explanation-text').innerText = q.expl;
                nextBtn.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
                nextBtn.classList.add('hidden');
            }
        }

        // 정답 선택
        function selectAnswer(selectedOpt) {
            userAnswers[currentIndex] = selectedOpt;
            const q = currentQuestions[currentIndex];

            if (selectedOpt === q.ans) {
                score++;
            }

            // 모든 보기 비활성화 및 정오답 스타일링
            const optButtons = document.getElementById('options-container').children;
            for (let i = 0; i < optButtons.length; i++) {
                const btn = optButtons[i];
                btn.disabled = true;
                btn.classList.add('option-disabled');
                
                const optNum = i + 1;
                if (optNum === q.ans) {
                    btn.classList.add('option-correct');
                } else if (optNum === selectedOpt) {
                    btn.classList.add('option-incorrect');
                }
            }

            // 해설 출력 (정오답 관계없이 원문 출력)
            const expBox = document.getElementById('explanation-box');
            document.getElementById('explanation-text').innerText = q.expl;
            expBox.classList.remove('hidden');

            // 다음 버튼 노출
            document.getElementById('btn-next').classList.remove('hidden');
        }

        // 다음 문제 또는 결과로 이동
        document.getElementById('btn-next').onclick = () => {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                loadQuestion();
                document.getElementById('quiz-screen').querySelector('.overflow-y-auto').scrollTop = 0;
            } else {
                showResult();
            }
        };

        // 결과 화면 표시
        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('flex');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = score;
        }

        // 홈으로 돌아가기
        document.getElementById('btn-home').onclick = () => {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
        };

        document.getElementById('btn-back').onclick = () => {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('flex');
            document.getElementById('home-screen').classList.remove('hidden');
        };

        // 초기 실행
        window.onload = renderHome;
    </script>
